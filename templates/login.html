{% extends 'base.html' %}
{% block content %}
<section class="card narrow">
  <img class="login-logo" src="{{ url_for('static', filename='ModestoLogo.png') }}" alt="Modesto Karate logo" />
  <h2>Sign In</h2>
  <form method="post">
    <label>Username
      <input type="text" name="username" autocomplete="username" required />
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required />
    </label>
    <button type="submit">Sign In</button>
  </form>
  <p class="hint" style="margin-top: 0.35rem;">Need a parent account? <a href="{{ url_for('register') }}">Create one</a></p>
</section>
{% endblock %}
