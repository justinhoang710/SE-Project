{% extends 'base.html' %}
{% block content %}
<section class="card narrow">
  <h2>Create Parent Account</h2>
  <form method="post">
    <label>Username
      <input type="text" name="username" minlength="3" autocomplete="username" required />
    </label>
    <label>Password
      <input type="password" name="password" minlength="6" autocomplete="new-password" required />
    </label>
    <label>Confirm Password
      <input type="password" name="confirm_password" minlength="6" autocomplete="new-password" required />
    </label>
    <label>Student Name (optional)
      <input type="text" name="student_name" />
    </label>
    <button type="submit">Create Account</button>
  </form>
  <p class="hint" style="margin-top: 0.35rem;"><a href="{{ url_for('login') }}">Back to sign in</a></p>
</section>
{% endblock %}
