<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title or 'Karate Academy Portal' }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=20260424a" />
  </head>
  <body class="theme-shell role-{{ session.get('role') or 'guest' }}">
    {% set logged_in = session.get('username') %}
    {% if logged_in %}
      <header id="react-shell-header"></header>
      <div class="app-shell">
        <main id="page-content" class="page-transition" data-endpoint="{{ request.endpoint or '' }}">
    {% else %}
      <div class="app-shell">
        <main id="page-content" class="page-transition" data-endpoint="{{ request.endpoint or '' }}">
    {% endif %}
          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              <div class="stack" style="margin-bottom: 0.7rem;">
                {% for category, message in messages %}
                  <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
              </div>
            {% endif %}
          {% endwith %}

          {% block content %}{% endblock %}
        </main>
      </div>

    <script>
      window.__APP_CONTEXT__ = {
        loggedIn: {{ 'true' if logged_in else 'false' }},
        username: {{ (session.get('username') or '')|tojson }},
        role: {{ (session.get('role') or '')|tojson }},
        endpoint: {{ (request.endpoint or '')|tojson }},
        logoUrl: {{ url_for('static', filename='ModestoLogo.png')|tojson }},
        navItems: [
          { label: 'Dashboard', hint: 'Overview', href: {{ url_for('dashboard')|tojson }}, endpoints: ['dashboard', 'manager_dashboard', 'employee_dashboard', 'parent_dashboard'] },
          {% if session.get('role') == 'employee' %}
          { label: 'Attendance', hint: 'Take class attendance', href: {{ url_for('employee_attendance')|tojson }}, endpoints: ['employee_attendance', 'attendance_summary'] },
          { label: 'Class Signup', hint: 'Join classes as staff', href: {{ url_for('staff_class_signup')|tojson }}, endpoints: ['staff_class_signup'] },
          { label: 'Progress', hint: 'Track student growth', href: {{ url_for('employee_progress')|tojson }}, endpoints: ['employee_progress'] },
          { label: 'Weekly Connections', hint: 'Staff weekly board', href: {{ url_for('staff_connections')|tojson }}, endpoints: ['staff_connections'] },
          { label: 'Shift Switch', hint: 'Request schedule swap', href: {{ url_for('request_switch')|tojson }}, endpoints: ['request_switch'] },
          { label: 'Request Off', hint: 'Submit absence date', href: {{ url_for('request_callout')|tojson }}, endpoints: ['request_callout'] },
          {% elif session.get('role') == 'manager' %}
          { label: 'Schedule Builder', hint: 'Plan classes', href: {{ url_for('manager_schedule')|tojson }}, endpoints: ['manager_schedule'] },
          { label: 'Class Offerings', hint: 'Open classes for signup', href: {{ url_for('manager_classes')|tojson }}, endpoints: ['manager_classes'] },
          { label: 'Enroll Students', hint: 'Add students to classes', href: {{ url_for('manager_enroll')|tojson }}, endpoints: ['manager_enroll'] },
          { label: 'Attendance', hint: 'Track attendance', href: {{ url_for('manager_attendance')|tojson }}, endpoints: ['manager_attendance', 'attendance_summary'] },
          { label: 'Class Signup', hint: 'Join classes as staff', href: {{ url_for('staff_class_signup')|tojson }}, endpoints: ['staff_class_signup'] },
          { label: 'Student Progress', hint: 'Promotions and notes', href: {{ url_for('manager_progress')|tojson }}, endpoints: ['manager_progress'] },
          { label: 'Weekly Connections', hint: 'Staff weekly board', href: {{ url_for('staff_connections')|tojson }}, endpoints: ['staff_connections'] },
          { label: 'Staff Accounts', hint: 'Create manager/employee logins', href: {{ url_for('manager_staff_accounts')|tojson }}, endpoints: ['manager_staff_accounts'] },
          { label: 'Techniques', hint: 'Edit technique list', href: {{ url_for('techniques')|tojson }}, endpoints: ['techniques'] },
          {% elif session.get('role') == 'parent' %}
          { label: 'My Kids Classes', hint: 'Signed-up classes', href: {{ url_for('parent_children_dashboard')|tojson }}, endpoints: ['parent_children_dashboard'] },
          {% endif %}
          { label: 'Account', hint: 'Email and password', href: {{ url_for('account_settings')|tojson }}, endpoints: ['account_settings'] },
          { label: 'Log Out', hint: 'Sign out securely', href: {{ url_for('logout')|tojson }}, endpoints: ['logout'] }
        ]
      };
    </script>
    <script defer src="{{ url_for('static', filename='app_shell.js') }}?v=20260424a"></script>
    <script>
      (() => {
        const wireTableFilters = () => {
          document.querySelectorAll('[data-table-filter]').forEach((input) => {
            const tableId = input.getAttribute('data-table-filter');
            const table = tableId ? document.getElementById(tableId) : null;
            if (!table || input.dataset.wired === 'true') return;
            input.dataset.wired = 'true';
            const rows = () => Array.from(table.querySelectorAll('tbody tr'));
            const applyFilter = () => {
              const query = input.value.trim().toLowerCase();
              rows().forEach((row) => {
                if (row.querySelector('td[colspan]')) return;
                const text = (row.textContent || '').toLowerCase();
                row.style.display = !query || text.includes(query) ? '' : 'none';
              });
            };
            input.addEventListener('input', applyFilter);
            applyFilter();
          });
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', wireTableFilters);
        } else {
          wireTableFilters();
        }
      })();
    </script>
  </body>
</html>
